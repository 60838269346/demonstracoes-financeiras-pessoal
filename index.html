<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstrações Financeiras Pessoais</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #cbd5e1;
            --radius: 10px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1450px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }
        h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        /* Contêiner com rolagem para congelar cabeçalho e coluna (altura reduzida para visualizar melhor) */
        .table-responsive {
            max-height: 400px;
            overflow: auto;
            position: relative;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            color: var(--text-muted);
        }
        .form-group select, .form-group input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-edit {
            background-color: var(--warning);
            padding: 6px 12px;
            font-size: 0.8rem;
            margin-right: 6px;
        }
        .btn-edit:hover {
            background-color: #d97706;
        }
        .btn-delete {
            background-color: var(--danger);
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 0.875rem;
        }
        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        /* Congelar o cabeçalho ao descer */
        th {
            background-color: #f8fafc;
            font-weight: 700;
            color: var(--text-muted);
            border-top: 1px solid #e2e8f0;
            border-bottom: 2px solid #cbd5e1;
            position: sticky;
            top: 0;
            z-index: 3;
        }
        /* Congelar a primeira coluna (plano de contas) ao ir para a lateral */
        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            background-color: #ffffff;
            z-index: 2;
            border-right: 2px solid #e2e8f0;
        }
        /* Ajuste do fundo da primeira coluna em cabeçalhos e grupos */
        th:first-child {
            background-color: #f8fafc !important;
            z-index: 4;
        }
        .row-group td {
            background-color: #f1f5f9 !important;
            font-weight: bold;
            color: #0f172a;
        }
        tr:hover td {
            background-color: #fcfcfc;
        }
        .row-group td:first-child {
            background-color: #f1f5f9 !important;
        }
        .col-horizontal {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-size: 0.825rem;
            font-weight: 500;
        }
        .col-trimestre {
            background-color: #e0f2fe;
            font-weight: 600;
            color: #0369a1;
        }
        .col-anual {
            background-color: #dbeafe;
            font-weight: bold;
            color: #1e40af;
        }
        .historico-container {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 15px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Demonstrações Financeiras Pessoais</h1>

        <!-- Formulário de Lançamentos -->
        <div class="card">
            <h2 id="tituloFormulario">Novo Lançamento</h2>
            <form id="formLancamento" class="form-grid">
                <input type="hidden" id="editIndex" value="-1">
                <div class="form-group">
                    <label for="anoLancamentoInput">Ano</label>
                    <input type="number" id="anoLancamentoInput" value="2026" required>
                </div>
                <div class="form-group">
                    <label for="tipoLancamento">Tipo</label>
                    <select id="tipoLancamento">
                        <option value="orcamento">Orçado (Planejado)</option>
                        <option value="transacao">Realizado (Efetivo)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mesLancamento">Mês</label>
                    <select id="mesLancamento">
                        <option value="Janeiro">Janeiro</option>
                        <option value="Fevereiro">Fevereiro</option>
                        <option value="Março">Março</option>
                        <option value="Abril">Abril</option>
                        <option value="Maio">Maio</option>
                        <option value="Junho">Junho</option>
                        <option value="Julho">Julho</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Setembro">Setembro</option>
                        <option value="Outubro">Outubro</option>
                        <option value="Novembro">Novembro</option>
                        <option value="Dezembro">Dezembro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="categoriaLancamento">Categoria</label>
                    <select id="categoriaLancamento">
                        <optgroup label="Receitas">
                            <option value="Salário">Salário</option>
                            <option value="Outras Receitas">Outras Receitas</option>
                            <option value="clientex externos">clientex externos</option>
                        </optgroup>
                        <optgroup label="Despesas">
                            <option value="Aluguel">Aluguel</option>
                            <option value="Contas Básicas">Contas Básicas</option>
                            <option value="Supermercado">Supermercado</option>
                            <option value="Cartão Itau">Cartão Itau</option>
                            <option value="Cartão Mercado pago">Cartão Mercado pago</option>
                            <option value="Cartão Inter">Cartão Inter</option>
                            <option value="Cartão magalu">Cartão magalu</option>
                        </optgroup>
                        <optgroup label="Despesas Semanais / Variáveis">
                            <option value="Lazer / Variados">Lazer / Variados</option>
                            <option value="Semana 01">Semana 01</option>
                            <option value="Semana 02">Semana 02</option>
                            <option value="Semana 03">Semana 03</option>
                            <option value="Semana 04">Semana 04</option>
                        </optgroup>
                        <optgroup label="Sobra Líquida / Destino">
                            <option value="Guardar">Guardar</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descricaoLancamento">Descrição</label>
                    <input type="text" id="descricaoLancamento" placeholder="Ex: Conta de luz, Compra X...">
                </div>
                <div class="form-group">
                    <label for="valorLancamento">Valor (R$)</label>
                    <input type="number" id="valorLancamento" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <button type="submit" id="btnSalvar">Adicionar Lançamento</button>
                </div>
            </form>
        </div>

        <!-- Visão Analítica -->
        <div class="card">
            <h2>Visão Analítica Anual (Orçado x Realizado, Trimestres e Anual)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr id="cabecalhoTabela">
                            <th>Categoria / Indicador</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAnaliticaAno">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Histórico de Lançamentos Compacto com Filtro de Ano e Mês -->
        <div class="card">
            <h2>Histórico de Lançamentos</h2>
            <div class="form-grid" style="margin-bottom: 15px;">
                <div class="form-group">
                    <label for="filtroAno">Filtrar por Ano</label>
                    <input type="number" id="filtroAno" value="2026">
                </div>
                <div class="form-group">
                    <label for="filtroMes">Filtrar por Mês</label>
                    <select id="filtroMes">
                        <option value="TODOS">Todos os Meses</option>
                        <option value="Janeiro">Janeiro</option>
                        <option value="Fevereiro">Fevereiro</option>
                        <option value="Março">Março</option>
                        <option value="Abril">Abril</option>
                        <option value="Maio">Maio</option>
                        <option value="Junho">Junho</option>
                        <option value="Julho">Julho</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Setembro">Setembro</option>
                        <option value="Outubro">Outubro</option>
                        <option value="Novembro">Novembro</option>
                        <option value="Dezembro">Dezembro</option>
                    </select>
                </div>
            </div>
            <div class="historico-container">
                <table>
                    <thead>
                        <tr>
                            <th>Ano</th>
                            <th>Tipo</th>
                            <th>Mês</th>
                            <th>Categoria</th>
                            <th>Descrição</th>
                            <th>Valor (R$)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaHistorico">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const mesesAno = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const trimestres = [
            { nome: '1º Trimestre', meses: ['Janeiro', 'Fevereiro', 'Março'] },
            { nome: '2º Trimestre', meses: ['Abril', 'Maio', 'Junho'] },
            { nome: '3º Trimestre', meses: ['Julho', 'Agosto', 'Setembro'] },
            { nome: '4º Trimestre', meses: ['Outubro', 'Novembro', 'Dezembro'] }
        ];

        const contasReceita = ['Salário', 'Outras Receitas', 'clientex externos'];
        const contasDespesa = ['Aluguel', 'Contas Básicas', 'Supermercado', 'Cartão Itau', 'Cartão Mercado pago', 'Cartão Inter', 'Cartão magalu', 'Lazer / Variados', 'Semana 01', 'Semana 02', 'Semana 03', 'Semana 04', 'Guardar'];
        
        const despesasFixasBase = ['Aluguel', 'Contas Básicas', 'Supermercado', 'Cartão Itau', 'Cartão Mercado pago', 'Cartão Inter', 'Cartão magalu'];
        const despesasSemanaisBase = ['Lazer / Variados', 'Semana 01', 'Semana 02', 'Semana 03', 'Semana 04'];

        let orcamentos = [];
        let transacoes = [];

        const tabelaAnaliticaAno = document.getElementById('tabelaAnaliticaAno');
        const cabecalhoTabela = document.getElementById('cabecalhoTabela');
        const formLancamento = document.getElementById('formLancamento');
        const tabelaHistorico = document.getElementById('tabelaHistorico');
        const editIndexInput = document.getElementById('editIndex');
        const tituloFormulario = document.getElementById('tituloFormulario');
        const btnSalvar = document.getElementById('btnSalvar');
        const filtroAno = document.getElementById('filtroAno');
        const filtroMes = document.getElementById('filtroMes');
        const anoLancamentoInput = document.getElementById('anoLancamentoInput');

        filtroAno.addEventListener('input', atualizarTabela);
        filtroMes.addEventListener('change', atualizarTabela);

        function montarCabecalho() {
            let htmlTh = '<th>Categoria / Indicador</th>';
            mesesAno.forEach(mes => {
                htmlTh += `<th>${mes} (Orç)</th><th>${mes} (Real)</th><th class="col-horizontal">% AH</th>`;
            });
            trimestres.forEach(trim => {
                htmlTh += `<th class="col-trimestre">${trim.nome} (Orç)</th><th class="col-trimestre">${trim.nome} (Real)</th><th class="col-trimestre">% AH</th>`;
            });
            htmlTh += `<th class="col-anual">Total Anual (Orç)</th><th class="col-anual">Total Anual (Real)</th><th class="col-anual">% AH</th>`;
            cabecalhoTabela.innerHTML = htmlTh;
        }

        function calcularValorPeriodo(anoFiltro, listaMeses, tipoCalculo, categoria) {
            let valOrc = 0;
            let valReal = 0;

            listaMeses.forEach(mes => {
                if (tipoCalculo === 'categoria') {
                    const catLower = categoria.trim().toLowerCase();
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && o.categoria.trim().toLowerCase() === catLower).forEach(o => valOrc += o.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && t.categoria.trim().toLowerCase() === catLower).forEach(t => valReal += t.valor);
                } else if (tipoCalculo === 'total_receitas') {
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => valOrc += o.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => valReal += t.valor);
                } else if (tipoCalculo === 'total_despesas') {
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => valOrc += o.valor);
                    transacoes.filter(t => t.ano === anoFiltro && o.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => valReal += t.valor);
                } else if (tipoCalculo === 'sobra_bruta') {
                    let recOrc = 0, despOrc = 0, recReal = 0, despReal = 0;
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => recOrc += o.valor);
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => despOrc += o.valor);
                    transacoes.filter(t => t.ano === anoFiltro && o.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => recReal += t.valor);
                    transacoes.filter(t => t.ano === anoFiltro && o.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => despReal += t.valor);
                    valOrc += (recOrc - despOrc);
                    valReal += (recReal - despReal);
                } else if (tipoCalculo === 'total_semanal') {
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && despesasSemanaisBase.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => valOrc += o.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && despesasSemanaisBase.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => valReal += t.valor);
                } else if (tipoCalculo === 'sobra_liquida') {
                    let recOrc = 0, despOrc = 0, semOrc = 0, guardarOrc = 0, recReal = 0, despReal = 0, semReal = 0, guardarReal = 0;
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => recOrc += o.valor);
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => despOrc += o.valor);
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && despesasSemanaisBase.some(c => c.trim().toLowerCase() === o.categoria.trim().toLowerCase())).forEach(o => semOrc += o.valor);
                    orcamentos.filter(o => o.ano === anoFiltro && o.mes === mes && o.categoria.trim().toLowerCase() === 'guardar').forEach(o => guardarOrc += o.valor);

                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && contasReceita.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => recReal += t.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && despesasFixasBase.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => despReal += t.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && despesasSemanaisBase.some(c => c.trim().toLowerCase() === t.categoria.trim().toLowerCase())).forEach(t => semReal += t.valor);
                    transacoes.filter(t => t.ano === anoFiltro && t.mes === mes && t.categoria.trim().toLowerCase() === 'guardar').forEach(t => guardarReal += t.valor);

                    valOrc += ((recOrc - despOrc) - semOrc - guardarOrc);
                    valReal += ((recReal - despReal) - semReal - guardarReal);
                }
            });

            return { valOrc, valReal };
        }

        function criarLinhaHorizontal(titulo, categoria, tipoCalculo, isGrupo = false, classeExtra = '') {
            const tr = document.createElement('tr');
            if (isGrupo) tr.className = 'row-group';
            if (classeExtra) tr.className += ' ' + classeExtra;

            let html = `<td>${titulo}</td>`;
            const anoAtualFiltro = parseInt(filtroAno.value) || 2026;

            // Meses Individuais
            mesesAno.forEach(mes => {
                const res = calcularValorPeriodo(anoAtualFiltro, [mes], tipoCalculo, categoria);
                const valOrc = res.valOrc;
                const valReal = res.valReal;

                let isDespesaCat = contasDespesa.some(c => c.trim().toLowerCase() === categoria.trim().toLowerCase());
                
                let corOrc = valOrc < 0 || isDespesaCat ? '#ef4444' : '#0f172a';
                let corReal = valReal < 0 || isDespesaCat ? '#ef4444' : '#0f172a';
                
                if (tipoCalculo.includes('sobra') || tipoCalculo === 'total_receitas') {
                    corOrc = valOrc >= 0 ? '#10b981' : '#ef4444';
                    corReal = valReal >= 0 ? '#10b981' : '#ef4444';
                }

                let estiloOrc = `style="color: ${corOrc}; font-weight: ${isGrupo ? 'bold' : 'normal'};"`;
                let estiloReal = `style="color: ${corReal}; font-weight: ${isGrupo ? 'bold' : 'normal'};"`;

                let percentualAH = 0;
                let temAH = false;
                if (valOrc !== 0) {
                    percentualAH = (valReal / valOrc) * 100;
                    temAH = true;
                }
                let textoAH = temAH ? percentualAH.toFixed(1) + '%' : '-';

                html += `<td ${estiloOrc}>R$ ${valOrc.toFixed(2)}</td>`;
                html += `<td ${estiloReal}>R$ ${valReal.toFixed(2)}</td>`;
                html += `<td class="col-horizontal">${textoAH}</td>`;
            });

            // Trimestres
            trimestres.forEach(trim => {
                const res = calcularValorPeriodo(anoAtualFiltro, trim.meses, tipoCalculo, categoria);
                const valOrc = res.valOrc;
                const valReal = res.valReal;

                let isDespesaCat = contasDespesa.some(c => c.trim().toLowerCase() === categoria.trim().toLowerCase());
                let corOrc = valOrc < 0 || isDespesaCat ? '#ef4444' : '#0f172a';
                let corReal = valReal < 0 || isDespesaCat ? '#ef4444' : '#0f172a';
                if (tipoCalculo.includes('sobra') || tipoCalculo === 'total_receitas') {
                    corOrc = valOrc >= 0 ? '#10b981' : '#ef4444';
                    corReal = valReal >= 0 ? '#10b981' : '#ef4444';
                }

                let estiloOrc = `style="color: ${corOrc}; font-weight: ${isGrupo ? 'bold' : 'normal'};"`;
                let estiloReal = `style="color: ${corReal}; font-weight: ${isGrupo ? 'bold' : 'normal'};"`;

                let percentualAH = 0;
                let temAH = false;
                if (valOrc !== 0) {
                    percentualAH = (valReal / valOrc) * 100;
                    temAH = true;
                }
                let textoAH = temAH ? percentualAH.toFixed(1) + '%' : '-';

                html += `<td class="col-trimestre" ${estiloOrc}>R$ ${valOrc.toFixed(2)}</td>`;
                html += `<td class="col-trimestre" ${estiloReal}>R$ ${valReal.toFixed(2)}</td>`;
                html += `<td class="col-trimestre">${textoAH}</td>`;
            });

            // Total Anual
            const resAno = calcularValorPeriodo(anoAtualFiltro, mesesAno, tipoCalculo, categoria);
            const valOrcAno = resAno.valOrc;
            const valRealAno = resAno.valReal;

            let isDespesaCat = contasDespesa.some(c => c.trim().toLowerCase() === categoria.trim().toLowerCase());
            let corOrcAno = valOrcAno < 0 || isDespesaCat ? '#ef4444' : '#1e40af';
            let corRealAno = valRealAno < 0 || isDespesaCat ? '#ef4444' : '#1e40af';
            if (tipoCalculo.includes('sobra') || tipoCalculo === 'total_receitas') {
                corOrcAno = valOrcAno >= 0 ? '#10b981' : '#ef4444';
                corRealAno = valRealAno >= 0 ? '#10b981' : '#ef4444';
            }

            let estiloOrcAno = `style="color: ${corOrcAno};"`;
            let estiloRealAno = `style="color: ${corRealAno};"`;

            let percentualAHAno = 0;
            let temAHAno = false;
            if (valOrcAno !== 0) {
                percentualAHAno = (valRealAno / valOrcAno) * 100;
                temAHAno = true;
            }
            let textoAHAno = temAHAno ? percentualAHAno.toFixed(1) + '%' : '-';

            html += `<td class="col-anual" ${estiloOrcAno}>R$ ${valOrcAno.toFixed(2)}</td>`;
            html += `<td class="col-anual" ${estiloRealAno}>R$ ${valRealAno.toFixed(2)}</td>`;
            html += `<td class="col-anual">${textoAHAno}</td>`;

            tr.innerHTML = html;
            tabelaAnaliticaAno.appendChild(tr);
        }

        function atualizarTabela() {
            tabelaAnaliticaAno.innerHTML = '';
            criarLinhaHorizontal('Total de Receitas', '', 'total_receitas', true);
            criarLinhaHorizontal('Salário', 'Salário', 'categoria');
            criarLinhaHorizontal('Outras Receitas', 'Outras Receitas', 'categoria');
            criarLinhaHorizontal('clientex externos', 'clientex externos', 'categoria');
            
            criarLinhaHorizontal('Total de Despesas', '', 'total_despesas', true);
            criarLinhaHorizontal('Aluguel', 'Aluguel', 'categoria');
            criarLinhaHorizontal('Contas Básicas', 'Contas Básicas', 'categoria');
            criarLinhaHorizontal('Supermercado', 'Supermercado', 'categoria');
            criarLinhaHorizontal('Cartão Itau', 'Cartão Itau', 'categoria');
            criarLinhaHorizontal('Cartão Mercado pago', 'Cartão Mercado pago', 'categoria');
            criarLinhaHorizontal('Cartão Inter', 'Cartão Inter', 'categoria');
            criarLinhaHorizontal('Cartão magalu', 'Cartão magalu', 'categoria');
            
            criarLinhaHorizontal('Sobra Bruta', '', 'sobra_bruta', true);
            
            criarLinhaHorizontal('Total Despesas Semanais / Variáveis', '', 'total_semanal', true);
            criarLinhaHorizontal('Lazer / Variados', 'Lazer / Variados', 'categoria');
            criarLinhaHorizontal('Semana 01', 'Semana 01', 'categoria');
            criarLinhaHorizontal('Semana 02', 'Semana 02', 'categoria');
            criarLinhaHorizontal('Semana 03', 'Semana 03', 'categoria');
            criarLinhaHorizontal('Semana 04', 'Semana 04', 'categoria');
            
            criarLinhaHorizontal('Guardar', 'Guardar', 'categoria');
            criarLinhaHorizontal('Sobra Líquida', '', 'sobra_liquida', true);
            
            atualizarTabelaHistorico();
        }

        function atualizarTabelaHistorico() {
            tabelaHistorico.innerHTML = '';
            const fAno = parseInt(filtroAno.value);
            const fMes = filtroMes.value;

            orcamentos.forEach((item, index) => {
                if (!item.ano) item.ano = 2026;
                if ((!isNaN(fAno) && item.ano !== fAno) || (fMes !== 'TODOS' && item.mes !== fMes)) return;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.ano}</td>
                    <td>Orçado (Planejado)</td>
                    <td>${item.mes}</td>
                    <td>${item.categoria}</td>
                    <td>${item.descricao || '-'}</td>
                    <td>R$ ${item.valor.toFixed(2)}</td>
                    <td>
                        <button class="btn-edit" onclick="prepararEdicao('orcamento', ${index})">Editar</button>
                        <button class="btn-delete" onclick="excluirLancamento('orcamento', ${index})">Excluir</button>
                    </td>
                `;
                tabelaHistorico.appendChild(tr);
            });

            transacoes.forEach((item, index) => {
                if (!item.ano) item.ano = 2026;
                if ((!isNaN(fAno) && item.ano !== fAno) || (fMes !== 'TODOS' && item.mes !== fMes)) return;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.ano}</td>
                    <td>Realizado (Efetivo)</td>
                    <td>${item.mes}</td>
                    <td>${item.categoria}</td>
                    <td>${item.descricao || '-'}</td>
                    <td>R$ ${item.valor.toFixed(2)}</td>
                    <td>
                        <button class="btn-edit" onclick="prepararEdicao('transacao', ${index})">Editar</button>
                        <button class="btn-delete" onclick="excluirLancamento('transacao', ${index})">Excluir</button>
                    </td>
                `;
                tabelaHistorico.appendChild(tr);
            });
        }

        window.prepararEdicao = function(tipo, index) {
            const senha = prompt('Digite a senha para editar:');
            if (senha !== '0') {
                if (senha !== null) alert('Senha incorreta!');
                return;
            }

            const item = tipo === 'orcamento' ? orcamentos[index] : transacoes[index];
            anoLancamentoInput.value = item.ano || 2026;
            document.getElementById('tipoLancamento').value = tipo;
            document.getElementById('mesLancamento').value = item.mes;
            document.getElementById('categoriaLancamento').value = item.categoria;
            document.getElementById('descricaoLancamento').value = item.descricao || '';
            document.getElementById('valorLancamento').value = item.valor;
            editIndexInput.value = `${tipo}_${index}`;
            
            tituloFormulario.textContent = 'Editar Lançamento';
            btnSalvar.textContent = 'Salvar Alterações';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.excluirLancamento = function(tipo, index) {
            const senha = prompt('Digite a senha para excluir:');
            if (senha !== '0') {
                if (senha !== null) alert('Senha incorreta!');
                return;
            }

            if (confirm('Tem certeza que deseja excluir este lançamento?')) {
                if (tipo === 'orcamento') {
                    orcamentos.splice(index, 1);
                } else {
                    transacoes.splice(index, 1);
                }
                atualizarTabela();
            }
        }

        formLancamento.addEventListener('submit', function(e) {
            e.preventDefault();
            const ano = parseInt(anoLancamentoInput.value) || 2026;
            const tipo = document.getElementById('tipoLancamento').value;
            const mes = document.getElementById('mesLancamento').value;
            const categoria = document.getElementById('categoriaLancamento').value;
            const descricao = document.getElementById('descricaoLancamento').value.trim();
            const valor = parseFloat(document.getElementById('valorLancamento').value);
            const editVal = editIndexInput.value;

            if (isNaN(valor)) return;

            if (editVal !== '-1') {
                const [tipoAntigo, indexAntigo] = editVal.split('_');
                const idx = parseInt(indexAntigo);
                
                if (tipoAntigo === tipo) {
                    if (tipo === 'orcamento') orcamentos[idx] = { ano, mes, categoria, descricao, valor };
                    else transacoes[idx] = { ano, mes, categoria, descricao, valor };
                } else {
                    if (tipoAntigo === 'orcamento') orcamentos.splice(idx, 1);
                    else transacoes.splice(idx, 1);

                    if (tipo === 'orcamento') orcamentos.push({ ano, mes, categoria, descricao, valor });
                    else transacoes.push({ ano, mes, categoria, descricao, valor });
                }

                editIndexInput.value = '-1';
                tituloFormulario.textContent = 'Novo Lançamento';
                btnSalvar.textContent = 'Adicionar Lançamento';
            } else {
                if (tipo === 'orcamento') {
                    orcamentos.push({ ano, mes, categoria, descricao, valor });
                } else {
                    transacoes.push({ ano, mes, categoria, descricao, valor });
                }
            }

            filtroAno.value = ano;
            atualizarTabela();
            formLancamento.reset();
            anoLancamentoInput.value = ano;
        });

        function inicializarSistema() {
            montarCabecalho();
            atualizarTabela();
        }

        inicializarSistema();
    </script>
</body>
</html>
